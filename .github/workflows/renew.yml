name: Auto Renew HidenCloud

on:
  workflow_dispatch:
  schedule:
    - cron: '30 05 * * 3'   # 每周三 05:30 UTC，可根据需要修改

permissions:
  actions: write
  contents: read

jobs:
  Renew-HidenCloud:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: ⚙ 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🛠️ 安装系统依赖和 Python 依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb
          pip install playwright requests 'requests[socks]'
          python -m playwright install --with-deps chromium

      - name: ⚙ 设置代理 (sing-box)
        env:
          NODE_LINK: ${{ secrets.NODE_LINK }}
        run: |
          bash <(wget -qO- https://main.ssss.nyc.mn/setup_proxy.sh)

      - name: 🚀 运行续期脚本
        id: renew
        continue-on-error: true
        env:
          ACCOUNTS_JSON: ${{ secrets.ACCOUNTS_JSON }}
          EMAIL: ${{ secrets.EMAIL }}
          PASSWORD: ${{ secrets.PASSWORD }}
          COOKIE_VALUE: ${{ secrets.COOKIE_VALUE }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          IS_PROXY: 'true'
          PROXY_SERVER: 'socks5://127.0.0.1:1080'
        run: |
          xvfb-run --auto-servernum --server-args="-screen 0 1920x1080x24" python3 app.py

      - name: 📤 上传诊断截图和 HTML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots-${{ github.run_number }}
          path: |
            *.png
            *.html
          if-no-files-found: ignore
          retention-days: 7

      - name: 🧽 清理进程和临时文件
        if: always()
        run: |
          pkill -f sing-box || true
          pkill -f chrome || true
          pkill -f Xvfb || true
          rm -f sing-box sing-box-config.json sing-box.log

      - name: 🧹 清理旧的工作流运行记录
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runs=$(gh run list --workflow="${{ github.workflow }}" --limit=100 --json databaseId --jq '.[].databaseId')
          count=0
          for run_id in $runs; do
            count=$((count + 1))
            if [ $count -gt 1 ]; then
              echo "删除运行记录: $run_id"
              gh run delete $run_id || true
            fi
          done

      - name: ❌ 若脚本失败则标记 job 失败
        if: steps.renew.outcome == 'failure'
        run: |
          echo "续期脚本执行失败，请查看上方日志和 Artifact 截图。"
          exit 1
